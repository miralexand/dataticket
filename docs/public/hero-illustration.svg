<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <!-- 背景装饰圆 -->
  <circle cx="320" cy="80" r="60" fill="url(#circle1)" opacity="0.3"/>
  <circle cx="80" cy="220" r="80" fill="url(#circle2)" opacity="0.2"/>
  
  <!-- 主卡片 -->
  <rect x="50" y="60" width="300" height="180" rx="16" fill="white" opacity="0.95"/>
  <rect x="50" y="60" width="300" height="180" rx="16" stroke="url(#stroke)" stroke-width="1"/>
  
  <!-- 卡片头部 -->
  <rect x="50" y="60" width="300" height="48" rx="16" fill="url(#header)"/>
  <rect x="50" y="84" width="300" height="24" fill="url(#header)"/>
  
  <!-- 标题 -->
  <rect x="70" y="76" width="120" height="16" rx="4" fill="white" opacity="0.9"/>
  <rect x="280" y="78" width="50" height="12" rx="6" fill="white" opacity="0.3"/>
  
  <!-- 统计行 -->
  <rect x="70" y="128" width="60" height="40" rx="8" fill="#F3F4F6"/>
  <rect x="80" y="136" width="20" height="8" rx="2" fill="#6366F1"/>
  <rect x="80" y="152" width="30" height="6" rx="2" fill="#9CA3AF"/>
  
  <rect x="145" y="128" width="60" height="40" rx="8" fill="#F3F4F6"/>
  <rect x="155" y="136" width="20" height="8" rx="2" fill="#F59E0B"/>
  <rect x="155" y="152" width="30" height="6" rx="2" fill="#9CA3AF"/>
  
  <rect x="220" y="128" width="60" height="40" rx="8" fill="#F3F4F6"/>
  <rect x="230" y="136" width="20" height="8" rx="2" fill="#10B981"/>
  <rect x="230" y="152" width="30" height="6" rx="2" fill="#9CA3AF"/>
  
  <!-- 列表项 -->
  <rect x="70" y="186" width="260" height="32" rx="6" fill="#F9FAFB"/>
  <circle cx="86" cy="202" r="6" fill="#10B981"/>
  <rect x="100" y="198" width="80" height="8" rx="2" fill="#6B7280"/>
  <rect x="280" y="198" width="40" height="8" rx="2" fill="#9CA3AF"/>
  
  <rect x="70" y="224" width="260" height="32" rx="6" fill="#F9FAFB"/>
  <circle cx="86" cy="240" r="6" fill="#F59E0B"/>
  <rect x="100" y="236" width="80" height="8" rx="2" fill="#6B7280"/>
  <rect x="280" y="236" width="40" height="8" rx="2" fill="#9CA3AF"/>
  
  <!-- 装饰元素 -->
  <circle cx="340" cy="200" r="30" fill="url(#accent)" opacity="0.15"/>
  <circle cx="340" cy="200" r="20" fill="url(#accent)" opacity="0.2"/>
  <circle cx="340" cy="200" r="10" fill="url(#accent)" opacity="0.3"/>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    
    <linearGradient id="header" x1="50" y1="60" x2="350" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5F67EE"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
    
    <linearGradient id="stroke" x1="50" y1="60" x2="350" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    
    <radialGradient id="circle1" cx="320" cy="80" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5F67EE"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </radialGradient>
    
    <radialGradient id="circle2" cx="80" cy="220" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5F67EE"/>
    </radialGradient>
    
    <radialGradient id="accent" cx="340" cy="200" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5F67EE"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </radialGradient>
  </defs>
</svg>
